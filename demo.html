<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule a Strategy Call – BornPixel</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #12141c;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 12, 16, 0.8);
      backdrop-filter: blur(10px);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      text-decoration: none;
      color: var(--text-white);
    }

    .logo span {
      color: var(--accent-blue);
    }

    .back-btn {
      color: var(--text-gray);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s;
    }

    .back-btn:hover {
      color: var(--text-white);
    }

    /* Main Booking Layout */
    main {
      flex: 1;
      padding: 50px 0;
      display: flex;
      align-items: center;
    }

    .booking-wrapper {
      display: grid;
      grid-template-columns: 320px 1fr;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Left Sidebar Details */
    .sidebar-info {
      padding: 40px 30px;
      border-right: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.01);
    }

    .badge {
      display: inline-block;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent-blue);
      margin-bottom: 15px;
    }

    .sidebar-info h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 15px;
    }

    .sidebar-info p {
      color: var(--text-gray);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .call-meta {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-white);
      font-weight: 600;
    }

    .meta-item i {
      color: var(--accent-blue);
      width: 20px;
    }

    /* Right Slot Picker Container */
    .slot-container {
      width: 100%;
      min-height: 600px;
      background: #0b0c10;
    }

    .slot-iframe {
      width: 100%;
      height: 100%;
      min-height: 600px;
      border: none;
    }

    /* Mobile View */
    @media (max-width: 850px) {
      .booking-wrapper {
        grid-template-columns: 1fr;
      }
      .sidebar-info {
        border-right: none;
        border-bottom: 1px solid var(--card-border);
        padding: 30px 20px;
      }
      .slot-container {
        min-height: 550px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  
  <header>
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">Velora<span style="color: gray;">Creatives</span></a>
      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
      </a>
    </div>
  </header>
  <!-- Main Booking Slot Render -->
  <main>
    <div class="container">
      <div class="booking-wrapper">
        
        <!-- Call Overview Details -->
        <div class="sidebar-info">
          <span class="badge">1-on-1 Discovery Call</span>
          <h1>Work With Me</h1>
          <p>Select a date and time slot that fits your schedule to discuss your project requirements, scope, and technical plan.</p>
          
          <div class="call-meta">
            <div class="meta-item">
              <i class="fa-regular fa-clock"></i> 30 Minutes
            </div>
            <div class="meta-item">
              <i class="fa-solid fa-video"></i> Google Meet / Zoom
            </div>
            <div class="meta-item">
              <i class="fa-regular fa-calendar-check"></i> Instant Confirmation
            </div>
          </div>
        </div>

        <!-- Clean Slot Picker Frame -->
        <div class="slot-container">
          <!-- 
            Note: Replace 'your-username/30min' with your Cal.com / Calendly link 
            Cal.com embedded here removes all external app logos and branding cleanly.
          -->
          <iframe 
            src="https://cal.com/veloracreative/30min?embed=true&theme=dark&layout=month_view" 
            class="slot-iframe" 
            title="Select Booking Slot">
          </iframe>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
